<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ExpenseIQ 💰</title>
  <link href="stylesheet" href="../expense/fontawesome-free-7.1.0-web/css/all.min.css">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>ExpenseIQ 💰</h1>
      <p class="subtitle">Track your money like a pro</p>
    </div>

    <!-- BALANCE -->
    <div class="balance-card">
      <p>Total Balance</p>
      <h2 id="balance">₦0.00</h2>
      <div class="balance-bar">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
      <p class="bar-label" id="bar-label">No transactions yet</p>
    </div>

    <!-- INCOME & EXPENSE -->
    <div class="summary">
      <div class="summary-card income">
        <div class="summary-icon">📈</div>
        <p>Total Income</p>
        <h3 id="total-income">₦0.00</h3>
      </div>
      <div class="summary-card expense">
        <div class="summary-icon">📉</div>
        <p>Total Expenses</p>
        <h3 id="total-expense">₦0.00</h3>
      </div>
    </div>

    <!-- BUDGET ALERT -->
    <div class="budget-section">
      <div class="budget-header">
        <h3>Monthly Budget</h3>
        <button class="btn-set-budget" onclick="toggleBudget()">Set Budget</button>
      </div>
      <div class="budget-input" id="budget-input" style="display:none;">
        <input type="number" id="budget-amount" placeholder="Enter monthly budget"/>
        <button onclick="setBudget()">Save</button>
      </div>
      <div id="budget-status"></div>
    </div>

    <!-- ADD TRANSACTION -->
    <div class="form-card">
      <h3>Add Transaction</h3>
      <input type="text" id="desc" placeholder="Description (e.g. Salary, Food)"/>
      <input type="number" id="amount" placeholder="Amount in ₦"/>
      
      <select id="category">
        <option value="">Select Category</option>
        <optgroup label="Income">
          <option value="salary">💼 Salary</option>
          <option value="freelance">💻 Freelance</option>
          <option value="gift">🎁 Gift</option>
          <option value="investment">📈 Investment</option>
          <option value="other-income">💰 Other Income</option>
        </optgroup>
        <optgroup label="Expenses">
          <option value="food">🍔 Food</option>
          <option value="transport">🚗 Transport</option>
          <option value="bills">💡 Bills</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="health">🏥 Health</option>
          <option value="entertainment">🎬 Entertainment</option>
          <option value="education">📚 Education</option>
          <option value="other-expense">💸 Other Expense</option>
        </optgroup>
      </select>

      <div class="type-btns">
        <button class="btn-income active" id="btn-income" onclick="setType('income')">+ Income</button>
        <button class="btn-expense" id="btn-expense" onclick="setType('expense')">- Expense</button>
      </div>
      <button class="btn-add" onclick="addTransaction()">Add Transaction ➕</button>
    </div>

    <!-- SPENDING BREAKDOWN -->
    <div class="breakdown-card">
      <h3>Spending Breakdown</h3>
      <div id="breakdown-list"></div>
    </div>

    <!-- FILTER -->
    <div class="filter-section">
      <h3>Transaction History</h3>
      <div class="filter-btns">
        <button class="filter-btn active" onclick="filterTransactions('all')">All</button>
        <button class="filter-btn" onclick="filterTransactions('income')">Income</button>
        <button class="filter-btn" onclick="filterTransactions('expense')">Expenses</button>
      </div>
    </div>

    <!-- TRANSACTION LIST -->
    <div class="transactions">
      <ul id="transaction-list"></ul>
    </div>

    <!-- EXPORT -->
    <button class="btn-export" onclick="exportCSV()">📥 Export to CSV</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
